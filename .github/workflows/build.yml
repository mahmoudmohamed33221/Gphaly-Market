name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      # 🆕 بنركّب Firebase (لازم للإشعارات اللحظية Push Notifications اللي بتشتغل
      # حتى لو التطبيق قافل تمامًا زي المنبه). ملف google-services.json مش سري
      # (مجرد معرّفات عامة للمشروع)، فمخزّن في الريبو نفسه. بنحطه في مكانه الصح
      # جوه مشروع أندرويد، وبنضيف الـ Google Services Gradle plugin يدويًا لأن
      # فولدر android/ بيتولّد من الصفر في كل بيلد (مش موجود في الريبو أصلًا).
      - name: Add Firebase (google-services)
        run: |
          cp google-services.json android/app/google-services.json
          PROJECT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"
          sed -i "s#classpath 'com.android.tools.build:gradle:[^']*'#&\n        classpath 'com.google.gms:google-services:4.4.4'#" "$PROJECT_GRADLE"
          sed -i "s#^apply plugin: 'com.android.application'#&\napply plugin: 'com.google.gms.google-services'#" "$APP_GRADLE"
          echo "----- android/build.gradle بعد التعديل -----"
          cat "$PROJECT_GRADLE"
          echo "----- android/app/build.gradle بعد التعديل -----"
          cat "$APP_GRADLE"

      # 🆕 كنا بنعتمد على إن Gradle "يلاقي" نسخة debug.keystore الثابتة في ~/.android بنفسه،
      # بس الطريقة دي مش مضمونة 100% لأنها بتعتمد على إن Gradle يدوّر في المكان ده بالظبط
      # وميستخدمش دالته الداخلية اللي بتولّد مفتاح عشوائي جديد لو حسّت إن في أي فرق.
      # الحل الأضمن: نحط نسخة من نفس debug.keystore الثابت (المخزّن في الريبو) جوه مشروع
      # الأندرويد نفسه، ونجبر Gradle صراحة (signingConfig) إنه يستخدمها للتوقيع دايمًا -
      # كده بنقفل تمامًا احتمال إن دالة توليد المفتاح العشوائي بتاعت Gradle تشتغل خالص.
      - name: Force stable debug signing (no random key ever)
        run: |
          cp debug.keystore android/app/debug.keystore
          GRADLE_FILE="android/app/build.gradle"
          sed -i 's/^android {$/android {\n    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' "$GRADLE_FILE"
          sed -i 's/buildTypes {/buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }/' "$GRADLE_FILE"
          echo "----- app/build.gradle بعد التعديل -----"
          cat "$GRADLE_FILE"

      # 🔧 إلغاء تثبيت البرنامج وتثبيته تاني (بدون تفريغ بيانات) مش بيمسح localStorage/الكاش
      # فعليًا زي ما المفروض، لأن أندرويد بيعمل "Auto Backup" تلقائي لبيانات التطبيق (بما فيها
      # ملفات WebView اللي فيها localStorage) على حساب جوجل بتاع المستخدم، وبيرجعها تلقائي أول
      # ما يتثبت التطبيق تاني - حتى لو كان "تثبيت جديد" فعليًا. ده اللي كان بيسبب مشكلة ظهور
      # "موسم" قديم (كاش قديم) لحظة بعد إعادة التثبيت قبل ما يتظبط على القيمة الصحيحة من
      # السيرفر، وبيعمل "ومضتين" غلق/فتح بدل ومضة واحدة. allowBackup="false" بيقفل الخاصية
      # دي خالص عشان أي تثبيت جديد يبدأ فعليًا فاضي زي ما المفروض.
      - name: Disable Android auto-backup (so a real reinstall starts truly clean)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$MANIFEST"
          grep -q 'android:allowBackup="false"' "$MANIFEST" || sed -i 's#<application #<application android:allowBackup="false" #' "$MANIFEST"
          echo "----- AndroidManifest.xml بعد تعطيل الـ Auto Backup -----"
          cat "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      # 🆕 بلجن @capacitor/geolocation مش بيضيف صلاحيات الموقع لملف الـ Manifest لوحده -
      # ده موضّح رسميًا في توثيق Capacitor إن المطوّر لازم يضيفها يدويًا. وبما إننا بنعمل
      # "cap add android" من الصفر في كل بيلد، بنضيف الصلاحيات هنا تلقائيًا بعد كل مرة.
      # وضفنا كمان POST_NOTIFICATIONS - أندرويد 13+ (API 33) محتاجها صراحة عشان
      # التطبيق يقدر يعرض إشعارات Push (زي المنبه) من غير ما يتفتح.
      - name: Add location permissions to AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          echo "----- AndroidManifest.xml بعد التعديل -----"
          cat "$MANIFEST"

      - name: Generate app icons
        run: |
          # 🆕 لو سبنا capacitor-assets تشتغل بـ "Easy Mode" (icon.png لوحدها من غير
          # خلفية محددة)، بيحط تلقائيًا خلفية بيضا صريحة ورا الأيقونة الافتراضية على
          # أندرويد (نفس السبب اللي كان بيحصل مع أيقونات المواسم قبل ما نظبطها).
          # فبنولّد له "خلفية شفافة" صريحة عشان يستخدمها بدل الأبيض الافتراضي.
          command -v convert >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y imagemagick)
          convert resources/icon.png -resize 1024x1024 resources/icon-only.png
          convert resources/icon.png -resize 1024x1024 resources/icon-foreground.png
          convert -size 1024x1024 xc:none PNG32:resources/icon-background.png
          npx capacitor-assets generate --android

      # 🆕 أيقونات "الموسم" لسطح المكتب (رمضان / عيد الفطر / الكريسماس / عيد الاضحي) -
      # بنولّد نسخة مربعة موحّدة من كل صورة في resources/ وبنحطها في drawable-nodpi
      # عشان تظهر بنفس الجودة على أي كثافة شاشة، وبعدين بنربطها بالـ activity-alias
      # المناسب في الخطوة اللي بعد كده.
      - name: Generate alternate season app icons
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          command -v convert >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y imagemagick)
          # 🆕 صور المواسم شبه ماليه الكانفاس بتاعها بالكامل (فراغ شفاف ضئيل جدًا حواليها)،
          # وبما إن الأيقونة بقت Adaptive حقيقية (foreground بيملأ الكانفاس زي ما هو من
          # غير أندرويد يصغّره تلقائي زي الأيقونة القديمة)، فلازم إحنا نعمل الهامش الآمن
          # بنفسنا يدويًا: نقص أي فراغ شفاف زايد (trim)، وبعدين نحط المحتوى في مساحة
          # حوالي 68% من الكانفاس النهائي مع هامش شفاف حواليه - نفس النسبة اللي
          # الأيقونة الافتراضية بتتولّد بيها، عشان الحجم يبقى متماثل مع باقي الأيقونات.
          generate_alt_icon() {
            SRC="$1"; NAME="$2"
            # 🆕 أندرويد بيطبّق دايمًا "قصة" (Mask دايرة/مربع بحواف دائرية) على أي
            # Adaptive Icon، وبيقص أي جزء من الرسمة برة "المنطقة الآمنة" (تقريبًا
            # 78% من المساحة). لو الرسمة مالية الكانفاس 100% (زي ما كانت قبل كده)،
            # الحواف والنصوص القريبة من الحافة بتتقص فعليًا على الجهاز - مش مشكلة
            # كاش، ده سلوك أندرويد نفسه. فبنسيب هامش بسيط حوالين المحتوى.
            convert "$SRC" -trim +repage -resize 300x300! -gravity center -background none -extent 432x432 "android/app/src/main/res/drawable-nodpi/ic_alt_${NAME}.png"
          }
          generate_alt_icon resources/ramadan.png   ramadan
          generate_alt_icon resources/fetr.png      fetr
          generate_alt_icon resources/adha.png      adha
          generate_alt_icon resources/christmas.png christmas
          # 🆕 بنولّد "Adaptive Icon" حقيقي (خلفية شفافة + رسمة فوقها) لكل موسم بدل ما
          # نسيب الأيقونة "legacy" عادية. من غير كده، أندرويد 8+ (وبعض واجهات الأجهزة
          # زي MIUI/Samsung) بيحس إن الأيقونة قديمة (مالهاش background/foreground منفصلين)
          # فبيغلفها تلقائي جوه شكل بخلفية بيضاء وبيصغّر الرسمة جواها (تقريبًا 66%) عشان
          # تتماشى مع باقي أيقونات الجهاز - وده بالظبط سبب الخلفية البيضا والحجم الصغير.
          # لما نديله Adaptive Icon جاهز بنفسنا (خلفية Transparent + Foreground)، بيوقف
          # يعمل الغلاف التلقائي ده، وتبقى الرسمة والخلفية زي ما احنا حددناها بالظبط.
          for NAME in ramadan fetr adha christmas; do
            cat > android/app/src/main/res/mipmap-anydpi-v26/ic_alt_${NAME}.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/transparent"/>
              <foreground android:drawable="@drawable/ic_alt_${NAME}"/>
          </adaptive-icon>
          EOF
          done
          echo "----- الأيقونات اللي اتولّدت -----"
          ls -la android/app/src/main/res/drawable-nodpi/
          ls -la android/app/src/main/res/mipmap-anydpi-v26/

      # 🆕 بنضيف activity-alias واحد لكل موسم (+ واحد افتراضي) في AndroidManifest.xml
      # عشان بلجن @capacitor-community/app-icon يقدر يبدّل أيقونة سطح المكتب وقت التشغيل
      # من غير أي إعادة تثبيت للتطبيق. الأسامي هنا (IconDefault, IconRamadan, IconFetr,
      # IconAdha, IconChristmas) لازم تفضل مطابقة حرفيًا للأسامي في كود الجافاسكريبت
      # (SEASON_NATIVE_ICON_NAMES) جوه www/index.html.
      - name: Add app-icon activity-aliases to AndroidManifest.xml
        run: |
          python3 - << 'PYEOF'
          import pathlib

          manifest_path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest_path.read_text(encoding="utf-8")

          # عطّل الـ LAUNCHER الأصلي بتاع MainActivity - هنستبدله بأليس "IconDefault"
          # عشان نقدر نتحكم فيه بنفس الطريقة اللي بنتحكم بيها في باقي المواسم
          launcher_category = '<category android:name="android.intent.category.LAUNCHER" />'
          if launcher_category in xml:
              xml = xml.replace(
                  launcher_category,
                  '<!-- ' + launcher_category + ' -->',
                  1
              )
          else:
              raise SystemExit("لم يتم العثور على LAUNCHER category في MainActivity - راجع الملف يدويًا")

          aliases = '''
              <activity-alias
                  android:name=".IconDefault"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:enabled="true"
                  android:exported="true"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconRamadan"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_alt_ramadan"
                  android:roundIcon="@mipmap/ic_alt_ramadan"
                  android:enabled="false"
                  android:exported="true"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconFetr"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_alt_fetr"
                  android:roundIcon="@mipmap/ic_alt_fetr"
                  android:enabled="false"
                  android:exported="true"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconAdha"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_alt_adha"
                  android:roundIcon="@mipmap/ic_alt_adha"
                  android:enabled="false"
                  android:exported="true"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconChristmas"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_alt_christmas"
                  android:roundIcon="@mipmap/ic_alt_christmas"
                  android:enabled="false"
                  android:exported="true"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity-alias>
          '''

          xml = xml.replace("</application>", aliases + "    </application>", 1)
          manifest_path.write_text(xml, encoding="utf-8")
          print("----- AndroidManifest.xml بعد إضافة الأليسات -----")
          print(xml)
          PYEOF

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gebhaly-market-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

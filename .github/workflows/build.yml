name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      # 🆕 كنا بنعتمد على إن Gradle "يلاقي" نسخة debug.keystore الثابتة في ~/.android بنفسه،
      # بس الطريقة دي مش مضمونة 100% لأنها بتعتمد على إن Gradle يدوّر في المكان ده بالظبط
      # وميستخدمش دالته الداخلية اللي بتولّد مفتاح عشوائي جديد لو حسّت إن في أي فرق.
      # الحل الأضمن: نحط نسخة من نفس debug.keystore الثابت (المخزّن في الريبو) جوه مشروع
      # الأندرويد نفسه، ونجبر Gradle صراحة (signingConfig) إنه يستخدمها للتوقيع دايمًا -
      # كده بنقفل تمامًا احتمال إن دالة توليد المفتاح العشوائي بتاعت Gradle تشتغل خالص.
      - name: Force stable debug signing (no random key ever)
        run: |
          cp debug.keystore android/app/debug.keystore
          GRADLE_FILE="android/app/build.gradle"
          sed -i 's/^android {$/android {\n    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' "$GRADLE_FILE"
          sed -i 's/buildTypes {/buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }/' "$GRADLE_FILE"
          echo "----- app/build.gradle بعد التعديل -----"
          cat "$GRADLE_FILE"

      - name: Sync Capacitor
        run: npx cap sync android

      # 🆕 بلجن @capacitor/geolocation مش بيضيف صلاحيات الموقع لملف الـ Manifest لوحده -
      # ده موضّح رسميًا في توثيق Capacitor إن المطوّر لازم يضيفها يدويًا. وبما إننا بنعمل
      # "cap add android" من الصفر في كل بيلد، بنضيف الصلاحيات هنا تلقائيًا بعد كل مرة.
      - name: Add location permissions to AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' "$MANIFEST"
          echo "----- AndroidManifest.xml بعد التعديل -----"
          cat "$MANIFEST"

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gebhaly-market-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
